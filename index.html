    <script>
        // Function to update the Indian time
        function updateIndianTime() {
            const now = new Date();
            const hours = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: false });
            const minutes = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', minute: '2-digit' });
            const seconds = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', second: '2-digit' });
            let ampm = now.toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', hour: 'numeric', hour12: true }).split(' ')[1];
            ampm =  ampm.toLocaleUpperCase();

            document.getElementById('indian-time').textContent = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', second:"numeric", hour12: true }).replace(/am|pm/i, m => m.toUpperCase());
        }

        // Dynamically set main's padding-top based on navbar height
        function setMainPadding() {
            var navbar = document.querySelector('.navbar.fixed-top');
            var main = document.querySelector('main');
            if (navbar && main) {
                var navHeight = navbar.offsetHeight;
                main.style.paddingTop = navHeight + 'px';
            }
        }
        window.addEventListener('DOMContentLoaded', setMainPadding);
        window.addEventListener('resize', setMainPadding);

        // Call the function to display time immediately when the page loads
        updateIndianTime();

        // Update the time every second (1000 milliseconds)
        setInterval(updateIndianTime, 1000);
    </script>
